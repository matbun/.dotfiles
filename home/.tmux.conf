# Keep the server alive with no sessions, so the systemd user service
# (tmux.service) can start it at login and continuum can restore into it
set -s exit-empty off

set -g mouse on
setw -g mode-keys vi
set-option -g set-clipboard on
set -g status-right ""

set -g allow-rename off
set -g automatic-rename off

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
#set -g @plugin 'catppuccin/tmux'
set -g @plugin 'wfxr/tmux-power'
# continuum must come after any theme: it hooks its autosave into status-right,
# which a later theme would overwrite
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Restore sessions automatically when tmux starts
set -g @continuum-restore 'on'
# Start the tmux server at login via ~/.config/systemd/user/tmux.service
# (if this is off, continuum *disables* that unit on every server start)
set -g @continuum-boot 'on'
# Save and restore the visible text of each pane
set -g @resurrect-capture-pane-contents 'on'

# Theme settings
#set -g @catppuccin_flavor 'mocha'
set -g @tmux_power_theme 'everforest'

# Status bar position
set -g status-justify left

set -g allow-rename off
set -g automatic-rename off

# Keep this at the very bottom
run '~/.tmux/plugins/tpm/tpm'
set -s set-clipboard on
